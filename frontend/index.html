<!doctype html>
<html lang="zh">
  <head>
    <script>document.documentElement.lang = localStorage.getItem('locale') || 'zh'</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&family=Noto+Sans+SC:wght@300;400;500;700;800;900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiroFish - 社交媒体舆论模拟系统" />
    <title>MiroFish - 预测万物</title>
  </head>
  <body>
    <div id="app"><p style="padding:32px;color:#334b40;font:14px sans-serif" role="status">正在加载投放规划界面…</p></div>
    <script type="module">
      import('/src/main.js').then(() => {
        if (!document.getElementById('app').__vue_app__) throw new Error('应用入口未正常启动')
      }).catch(error => {
        console.error('应用加载失败', error)
        const root = document.getElementById('app')
        root.replaceChildren()
        const message = document.createElement('p')
        message.textContent = '界面加载失败，请刷新重试。若仍无法打开，请检查前端服务。'
        message.style.cssText = 'padding:32px;color:#933;font:14px sans-serif'
        root.append(message)
        const button = document.createElement('button')
        button.textContent = '重新加载'
        button.onclick = () => location.reload()
        root.append(button)
      })
    </script>
  </body>
</html>
